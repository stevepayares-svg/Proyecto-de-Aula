<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>403 - Acceso denegado</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="contenedor" style="text-align:center;">
    <div style="font-size:3.5em; font-weight:700; color:#b3261e; line-height:1;">403</div>
    <h1 style="margin-top:10px;">Acceso denegado</h1>
    <div class="alerta error" style="text-align:left;"><span th:if="${#authorization.expression('isAuthenticated()')}">Tu rol (<b th:text="${#authentication.authorities}"></b>) no tiene permiso para entrar a esta zona.</span><span th:unless="${#authorization.expression('isAuthenticated()')}">No tienes permiso para entrar a esta zona.</span></div>

    <a sec:authorize="hasRole('CLIENTE')" th:href="@{/solicitudes/nueva}" class="boton-link" style="display:inline-block; margin-top:10px;">Volver a mi menú</a>
    <a sec:authorize="hasRole('EMPLEADO')" th:href="@{/dashboard}" class="boton-link" style="display:inline-block; margin-top:10px;">Volver al dashboard</a>
    <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="boton-link" style="display:inline-block; margin-top:10px;">Ir al login</a>
</div>
</body>
</html>
