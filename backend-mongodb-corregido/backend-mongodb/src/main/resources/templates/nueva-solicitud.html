<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Solicitud - PQRSF</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="pagina">
    <div class="tarjeta tarjeta-ancha">
        <h1>Radicar una solicitud (PQRSF)</h1>
        <p class="subtitulo">Petición, Queja, Reclamo, Sugerencia o Felicitación — cuéntanos qué pasó.</p>

        <div th:if="${error}" class="alerta error" th:text="${error}"></div>

        <form th:action="@{/solicitudes/nueva}" method="post" class="formulario">

            <label>Tipo de solicitud:</label>
            <select name="tipoSolicitudId" required>
                <option value="">Selecciona un tipo</option>
                <option th:each="tipo : ${tipos}"
                        th:value="${tipo.id}"
                        th:text="${tipo.nombre}"></option>
            </select>

            <label>Título breve:</label>
            <input type="text" name="titulo" placeholder="Ej: Máquina de pecho dañada" required>

            <label>Describe tu solicitud:</label>
            <textarea name="descripcion" rows="4" placeholder="Cuéntanos con detalle qué pasó..." required></textarea>

            <label>Categoría (elige al menos una):</label>
            <div class="checkbox-grupo">
                <label class="checkbox-item" th:each="cat : ${categorias}">
                    <input type="checkbox" name="categoriaIds" th:value="${cat.id}">
                    <span th:text="${cat.nombre}"></span>
                </label>
            </div>

            <div class="fila-2">
                <div>
                    <label>Prioridad:</label>
                    <select name="prioridad">
                        <option value="Baja">Baja</option>
                        <option value="Media" selected>Media</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
                <div>
                    <label>Sede:</label>
                    <input type="text" name="sede" placeholder="Ej: Sede Centro">
                </div>
            </div>

            <div class="fila-2">
                <div>
                    <label>Zona del gimnasio:</label>
                    <input type="text" name="zonaGimnasio" placeholder="Ej: Zona de cardio">
                </div>
                <div>
                    <label>Máquina afectada (opcional):</label>
                    <input type="text" name="maquinaAfectada" placeholder="Ej: Caminadora 3">
                </div>
            </div>

            <button type="submit">Enviar solicitud</button>
        </form>
    </div>
</div>
</body>
</html>
