# ======================= Archivo .env =======================
# Los secretos (JWT_SECRET, GOOGLE_CLIENT_SECRET) viven en el archivo .env de la
# carpeta pqrsfProaula-JWT-OAuth2, que NO se sube a GitHub. Spring lo lee solo,
# sin importar si arrancas con Run, con el Spring Boot Dashboard o con Maven.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.data.mongodb.uri=mongodb://localhost:27017/solicitudes_db_assj


spring.data.mongodb.auto-index-creation=true


server.port=8081

# Con JWT el login ya no vive en la sesion. La sesion solo se usa unos
# segundos durante el login con Google (para guardar el "state" de OAuth2).
server.servlet.session.timeout=2m

server.servlet.session.cookie.http-only=true


server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

# ============================ JWT ============================
# Clave con la que se FIRMA el token (minimo 32 caracteres).
# Se lee del archivo .env (JWT_SECRET). No escribas la clave aqui.
app.jwt.secret=${JWT_SECRET}
# Cuanto dura el token, en milisegundos (1800000 = 30 minutos).
# Pon 120000 (2 minutos) si quieres mostrar en clase que el token expira.
app.jwt.expiration-ms=1800000
# Nombre de la cookie donde el navegador guarda el token
app.jwt.cookie-name=JWT_TOKEN

# true  = /api/** exige "Authorization: Bearer <token>" (o la cookie)
# false = /api/** queda abierto como estaba antes
app.security.proteger-api=true

# ===================== OAuth2 con Google =====================
# Los valores salen de Google Cloud Console (ver GUIA_JWT_OAUTH2.md).
# El secreto se lee del archivo .env (GOOGLE_CLIENT_SECRET). No lo escribas aqui.
# URI de redireccion que debes registrar en Google (puerto 8081):
#   http://localhost:8081/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:936175275895-sakr8c3cb655jd863shbmskv9cs5vuan.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ============ Generador de datos masivos (Base de Datos II) ============
# Pon "true", arranca el backend UNA vez (genera ~20.000 documentos) y
# vuelve a ponerlo en "false". Si ya se generaron, no los repite.
app.seed.masivo.activo=false
app.seed.masivo.clientes=2000
app.seed.masivo.solicitudes=18000
